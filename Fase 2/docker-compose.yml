services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-frontend
    ports:
      - "8080:80"
    restart: unless-stopped

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: capstone-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
