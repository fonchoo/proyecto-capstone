# ============================================================
# nginx.conf (usado por el contenedor de PRODUCCION del frontend)
# ============================================================
# En produccion nginx cumple DOS tareas:
#   1) Sirve el build estatico del frontend (dist/).
#   2) Proxea /api/ hacia el contenedor de la API (server:3000), que
#      corre en la misma red de Compose (ver docker-compose.prod.yml).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip de los assets generados por Vite.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------
    # API: reenvia /api/* al servidor Express.
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------
    # SPA (React Router)
    # ------------------------------------------------------------
    # Cualquier ruta que NO sea un archivo real (ej: /dashboard,
    # /usuarios) debe servir index.html: React Router decide que
    # vista mostrar. Sin esto, recargar /dashboard daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache prolongada para los assets con hash de Vite.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}